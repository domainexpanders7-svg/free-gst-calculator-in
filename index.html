<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instant GST &amp; Invoice Calculator – India</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#0f0f0f;
        --bg-card:rgba(255,255,255,0.07);
        --text:#e0e0e0;
        --accent:#00bcd4;
        --glass:#ffffff12;
        --radius:12px;
        --transition:.3s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
        font-family:'Poppins',sans-serif;
        background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 100%);
        color:var(--text);
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:1rem;
    }
    h1{font-weight:600;margin-bottom:1rem;text-align:center;}
    .container{
        background:var(--bg-card);
        border-radius:var(--radius);
        padding:2rem;
        max-width:420px;
        width:100%;
        backdrop-filter:blur(12px);
        box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);
        transition:var(--transition);
    }
    .field{
        margin-bottom:1.2rem;
        display:flex;
        flex-direction:column;
    }
    .field label{
        margin-bottom:0.4rem;
        font-size:0.9rem;
        color:var(--accent);
    }
    .field input{
        padding:0.6rem 0.8rem;
        border:none;
        border-radius:var(--radius);
        background:var(--glass);
        color:var(--text);
        font-size:1rem;
        outline:none;
        transition:var(--transition);
    }
    .field input:focus{
        background:rgba(255,255,255,0.2);
    }
    .result{
        background:var(--glass);
        border-radius:var(--radius);
        padding:1rem;
        margin-top:1rem;
        text-align:center;
    }
    .result p{
        margin:0.4rem 0;
        font-size:1.1rem;
    }
    .btn{
        background:var(--accent);
        color:#fff;
        border:none;
        padding:0.8rem 1.2rem;
        border-radius:var(--radius);
        cursor:pointer;
        font-size:1rem;
        width:100%;
        transition:var(--transition);
    }
    .btn:hover{
        background:#0097a7;
    }
    #ad-slot-top, #ad-slot-bottom{
        width:100%;
        max-width:728px;
        height:90px;
        background:#333;
        color:#aaa;
        display:flex;
        align-items:center;
        justify-content:center;
        margin:1rem 0;
        border-radius:var(--radius);
        font-size:0.9rem;
    }
    @media (max-width:600px){
        .container{padding:1.5rem;}
        #ad-slot-top, #ad-slot-bottom{height:60px;}
    }
</style>
</head>
<body>
    <div id="ad-slot-top">[Ad Slot – Top Banner]</div>

    <h1>Instant GST &amp; Invoice Calculator</h1>

    <div class="container">
        <div class="field">
            <label for="amount">Base Amount (₹)</label>
            <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
        </div>

        <div class="field">
            <label for="gst">GST Rate (%)</label>
            <input type="number" id="gst" placeholder="e.g., 18" min="0" step="0.01">
        </div>

        <button class="btn" id="calcBtn">Calculate</button>

        <div class="result" id="resultBox" style="display:none;">
            <p id="gstAmt">GST: ₹0.00</p>
            <p id="cgstAmt">CGST (½): ₹0.00</p>
            <p id="sgstAmt">SGST (½): ₹0.00</p>
            <p id="totalAmt">Total Invoice: ₹0.00</p>
            <button class="btn" id="copyBtn" style="margin-top:0.8rem;background:#4caf50;">Copy Total</button>
        </div>
    </div>

    <div id="ad-slot-bottom">[Ad Slot – Bottom Banner]</div>

<script>
(function(){
    const amountInput=document.getElementById('amount');
    const gstInput=document.getElementById('gst');
    const calcBtn=document.getElementById('calcBtn');
    const resultBox=document.getElementById('resultBox');
    const gstAmt=document.getElementById('gstAmt');
    const cgstAmt=document.getElementById('cgstAmt');
    const sgstAmt=document.getElementById('sgstAmt');
    const totalAmt=document.getElementById('totalAmt');
    const copyBtn=document.getElementById('copyBtn');

    function format(num){
        return Number(num).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function calculate(){
        const base=parseFloat(amountInput.value)||0;
        const gstRate=parseFloat(gstInput.value)||0;

        const gstValue=base*gstRate/100;
        const cgst=gstValue/2;
        const sgst=gstValue/2;
        const total=base+gstValue;

        gstAmt.textContent=`GST (${gstRate}%): ₹${format(gstValue)}`;
        cgstAmt.textContent=`CGST (½): ₹${format(cgst)}`;
        sgstAmt.textContent=`SGST (½): ₹${format(sgst)}`;
        totalAmt.textContent=`Total Invoice: ₹${format(total)}`;

        resultBox.style.display='block';
    }

    calcBtn.addEventListener('click',calculate);
    // Enter key support
    [amountInput,gstInput].forEach(el=>el.addEventListener('keyup',e=>{if(e.key==='Enter')calculate();}));

    copyBtn.addEventListener('click',()=>{
        const totalText=totalAmt.textContent.replace(/[^0-9.]/g,'');
        navigator.clipboard.writeText(totalText).then(()=>{
            copyBtn.textContent='Copied!';
            setTimeout(()=>{copyBtn.textContent='Copy Total';},1500);
        });
    });
})();
</script>
</body>
</html>
